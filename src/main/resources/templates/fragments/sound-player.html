<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="soundPlayer" class="mb-16 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.7s_forwards]" style="animation: fadeInUp 0.6s ease-out 0.7s forwards;">
        <div class="flex items-baseline gap-3 mb-6">
            <h2 class="text-4xl border-b-2 border-[#8B7355] pb-1 font-serif-display font-semibold">Sonic Atmosphere</h2>
            <span class="text-sm opacity-40">Audio Experience</span>
        </div>
        <div class="w-full p-6 bg-gradient-to-br from-[#8B7355]/10 to-[#5C4033]/10 border border-[#8B7355]/20 backdrop-blur-sm">
            <audio id="audioPlayer" src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" loop></audio>
            <div class="flex items-center justify-between">
                <div class="flex-1">
                    <h3 class="text-lg mb-1 font-serif-body">Ambient Gallery Music</h3>
                    <p class="text-sm opacity-60">Curated soundscape for creative contemplation</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="playPauseBtn" class="p-3 bg-[#8B7355]/20 hover:bg-[#8B7355]/30 transition-colors rounded-full">
                        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button id="muteBtn" class="p-3 hover:bg-white/10 transition-colors rounded-full">
                        <svg id="volumeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                        <svg id="muteIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </button>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-[#8B7355]/20">
                <p class="text-xs opacity-40">Click the play button to start the ambient soundscape. Music sourced from free public domain libraries.</p>
            </div>
        </div>
    </section>
</body>
</html>
